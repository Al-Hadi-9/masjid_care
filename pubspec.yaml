name: masjid_care_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  http: ^1.2.0
  intl: ^0.20.2

  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.0.0
  google_sign_in: ^6.2.1
  flutter_svg: ^2.3.0
  webview_flutter: ^4.7.0
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  cloud_functions: ^6.5.0

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/bkash_logo.png
    - assets/images/nagad_logo.png
    - assets/data/hadith_bn.json
    - assets/images/masjid.png
    - assets/images/masjid_badge.png
    - assets/images/icon.jpg
    - assets/images/icon.png

  fonts:
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: Scheherazade New
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/masjid.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/masjid.png"
